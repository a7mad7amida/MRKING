name: Build MAN Water v2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "man-water-app/**"
      - ".github/workflows/man-water-v2.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate project
        working-directory: man-water-app
        run: node --check app/src/main/assets/app.js && gradle tasks --console=plain
      - name: Build APK
        working-directory: man-water-app
        run: gradle assembleDebug --stacktrace --console=plain
      - name: Rename APK
        run: cp man-water-app/app/build/outputs/apk/debug/app-debug.apk MAN-Water-v2.0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAN-Water-v2.0.3-APK
          path: MAN-Water-v2.0.3.apk
          if-no-files-found: error
          retention-days: 30
