name: Build MAN Water APK

on:
  workflow_dispatch:
  push:
    paths:
      - "man-water-android/**"
      - ".github/workflows/man-water-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract Android project
        run: |
          mkdir -p build-man-water
          unzip -q man-water-android/MAN-Water-Android-v1.0.2.zip -d build-man-water
      - name: Build debug APK
        working-directory: build-man-water/MAN-Water-Android-v1.0.0
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(grep -E "(^FAILURE:|^\* What went wrong:|^> | error: )" build.log | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Android build details::${message}"
            exit "$code"
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAN-Water-Build-Log
          path: build-man-water/MAN-Water-Android-v1.0.0/build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAN-Water-APK
          path: build-man-water/MAN-Water-Android-v1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
