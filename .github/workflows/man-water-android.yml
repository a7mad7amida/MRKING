name: Build MAN Water APK

on:
  workflow_dispatch:
  push:
    paths:
      - "man-water-android/**"
      - ".github/workflows/man-water-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract verified Android project
        run: |
          mkdir -p build-man-water
          unzip -t man-water-android/MAN-Water-Android-v1.3.0.zip
          unzip -q man-water-android/MAN-Water-Android-v1.3.0.zip -d build-man-water
      - name: Build debug APK
        working-directory: build-man-water/MAN-Water-Android-v1.0.0
        run: gradle assembleDebug --stacktrace --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAN-Water-APK-v1.3.0
          path: build-man-water/MAN-Water-Android-v1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
