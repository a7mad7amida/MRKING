plugins { id 'com.android.application' }

dependencies { implementation 'androidx.work:work-runtime:2.10.1' }

def signingDirectory = file('../.signing')
def signingPasswordFile = new File(signingDirectory, 'password.txt')
def stableSigningPassword = signingPasswordFile.exists() ? signingPasswordFile.getText('UTF-8').trim() : ''

android {
    namespace 'ps.man.water'
    compileSdk 35

    defaultConfig {
        applicationId 'ps.man.water'
        minSdk 26
        targetSdk 35
        versionCode 207
        versionName '2.0.7'
    }

    signingConfigs {
        stableDebug {
            storeFile file('../.signing/man-water-stable.jks')
            storePassword stableSigningPassword
            keyAlias 'man-water'
            keyPassword stableSigningPassword
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (stableSigningPassword) signingConfig signingConfigs.stableDebug
        }
    }
}
